# Pipeline de Integração Contínua do TaskAnalyzer (Fase 3).
# Roda o Test Harness a cada push ou Pull Request em main e develop.
# Nenhum job pode ignorar falhas: um teste vermelho bloqueia o merge.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test Harness (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Test Harness
        run: pytest tests/test_harness.py -v

  docker:
    name: Docker (build + testes no container)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t sdd-task-analyzer:ci .

      - name: Executar os testes dentro do container
        run: docker run --rm sdd-task-analyzer:ci
